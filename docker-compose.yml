services:
  api:
    image: 432159388664.dkr.ecr.us-east-1.amazonaws.com/clashperk-api:latest
    container_name: service-api
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8080
    ports:
      - '8080:8080'
    mem_limit: 1g
    networks:
      - default_net

  worker:
    image: 432159388664.dkr.ecr.us-east-1.amazonaws.com/clashperk-worker:latest
    container_name: service-worker
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8090
      # Every fork pushes spans and metrics to the shared OTel collector, which
      # runs on Railway (project `monitoring`) alongside Prometheus and Grafana.
      # OTEL_EXPORTER_OTLP_HEADERS carries the ingest credentials and lives in
      # .env — the endpoint is public, so without it every export is rejected.
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector-production-eb06.up.railway.app
      - OTEL_SERVICE_NAME=clashperk-worker
      #
      # Trace sampling — keep COMMENTED. The question this A/B was written for is
      # answered: tracing overhead was NOT the latency culprit (the cause was
      # in-flight concurrency; see libs/clash-client/src/inflight-limiter.ts).
      #
      # Enabling it quietly breaks the dashboards: parentbased samples at the
      # ROOT span (one enqueue per fork per cycle), so child spans like
      # PlayersService.startPolling drop wholesale and every span-derived rate
      # reads 0 or ~1/20th of reality. This bit on 2026-08-04 when a container
      # recreate picked these lines up and "Clans polled" flatlined at 0.
      # The collector handles the full ~3,000 spans/s fine, so there is no
      # stability reason to sample.
      # - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      # - OTEL_TRACES_SAMPLER_ARG=0.05
      - RANKING_TRACKING=1
      - CLAN_TRACKING=1
      - CAPITAL_TRACKING=1
      - WAR_TRACKING=1
      - PLAYER_TRACKING=1
    ports:
      - '8090:8090'
    mem_limit: 2g
    networks:
      - default_net

networks:
  default_net:
    external: true
    name: default_net
